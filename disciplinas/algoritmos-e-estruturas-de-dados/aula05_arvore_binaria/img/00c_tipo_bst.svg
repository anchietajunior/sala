<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <text x="350" y="40" text-anchor="middle" font-size="18" font-weight="600" fill="#2c5d8a">
    Tipo 3 — Árvore binária de busca (BST)
  </text>
  <text x="350" y="62" text-anchor="middle" font-size="13" fill="#5a7a9a" font-style="italic">
    binária + regra: menor à esquerda, maior à direita (recursivamente)
  </text>

  <!-- regiões anotadas atrás dos nós (desenhadas primeiro para ficarem por baixo) -->
  <rect x="60" y="195" width="320" height="170" rx="10"
        fill="#e8f0f8" fill-opacity="0.55" stroke="#5a7a9a" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="220" y="385" text-anchor="middle" font-size="13" fill="#2c5d8a" font-weight="600">
    todos &lt; 50
  </text>

  <rect x="420" y="195" width="220" height="170" rx="10"
        fill="#e8f0f8" fill-opacity="0.55" stroke="#5a7a9a" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="530" y="385" text-anchor="middle" font-size="13" fill="#2c5d8a" font-weight="600">
    todos &gt; 50
  </text>

  <!-- raiz -->
  <text x="290" y="115" text-anchor="end" font-size="14" font-weight="600" fill="#2c5d8a">raiz →</text>

  <!-- Arestas -->
  <line x1="350" y1="110" x2="220" y2="225" stroke="#2c5d8a" stroke-width="2"/>
  <line x1="350" y1="110" x2="500" y2="225" stroke="#2c5d8a" stroke-width="2"/>
  <line x1="220" y1="225" x2="140" y2="340" stroke="#2c5d8a" stroke-width="2"/>
  <line x1="220" y1="225" x2="300" y2="340" stroke="#2c5d8a" stroke-width="2"/>

  <!-- Nó 50 (raiz) -->
  <circle cx="350" cy="110" r="28" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2"/>
  <text x="350" y="117" text-anchor="middle" font-size="20" fill="#222"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">50</text>

  <!-- Nó 30 -->
  <circle cx="220" cy="225" r="28" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2"/>
  <text x="220" y="232" text-anchor="middle" font-size="20" fill="#222"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">30</text>

  <!-- Nó 70 -->
  <circle cx="500" cy="225" r="28" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2"/>
  <text x="500" y="232" text-anchor="middle" font-size="20" fill="#222"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">70</text>

  <!-- Nó 20 -->
  <circle cx="140" cy="340" r="28" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2"/>
  <text x="140" y="347" text-anchor="middle" font-size="20" fill="#222"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">20</text>

  <!-- Nó 40 -->
  <circle cx="300" cy="340" r="28" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2"/>
  <text x="300" y="347" text-anchor="middle" font-size="20" fill="#222"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">40</text>

  <!-- separador + nota -->
  <line x1="100" y1="405" x2="600" y2="405" stroke="#cfd6dd" stroke-width="1"/>
  <text x="350" y="428" text-anchor="middle" font-size="13" fill="#5a7a9a" font-style="italic">
    a regra vale para a raiz E para a raiz de cada subárvore · busca em O(log n) quando balanceada
  </text>
</svg>
