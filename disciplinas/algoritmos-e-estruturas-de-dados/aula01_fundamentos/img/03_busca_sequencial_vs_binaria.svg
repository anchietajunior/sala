<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 700 460"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <text x="350" y="38" text-anchor="middle"
        font-size="18" font-weight="600" fill="#2c5d8a">Dois algoritmos, o mesmo problema: achar o 31</text>

  <!-- ================= BUSCA SEQUENCIAL ================= -->
  <text x="60" y="86" font-size="16" font-weight="600" fill="#2c5d8a">Busca sequencial</text>
  <text x="640" y="86" text-anchor="end" font-size="15" fill="#5a7a9a">6 comparações</text>

  <!-- ordem de visita -->
  <text x="98"  y="118" text-anchor="middle" font-size="14" fill="#5a7a9a">1ª</text>
  <text x="182" y="118" text-anchor="middle" font-size="14" fill="#5a7a9a">2ª</text>
  <text x="266" y="118" text-anchor="middle" font-size="14" fill="#5a7a9a">3ª</text>
  <text x="350" y="118" text-anchor="middle" font-size="14" fill="#5a7a9a">4ª</text>
  <text x="434" y="118" text-anchor="middle" font-size="14" fill="#5a7a9a">5ª</text>
  <text x="518" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#2c5d8a">6ª ✓</text>

  <!-- células (7 × 76px, gap 8, x0=60) -->
  <rect x="60"  y="126" width="76" height="54" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <rect x="144" y="126" width="76" height="54" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <rect x="228" y="126" width="76" height="54" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <rect x="312" y="126" width="76" height="54" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <rect x="396" y="126" width="76" height="54" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <rect x="480" y="126" width="76" height="54" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2.5" rx="4"/>
  <rect x="564" y="126" width="76" height="54" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="2" rx="4"/>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#222">
    <text x="98"  y="160" text-anchor="middle">3</text>
    <text x="182" y="160" text-anchor="middle">8</text>
    <text x="266" y="160" text-anchor="middle">12</text>
    <text x="350" y="160" text-anchor="middle">17</text>
    <text x="434" y="160" text-anchor="middle">25</text>
    <text x="518" y="160" text-anchor="middle" font-weight="600">31</text>
    <text x="602" y="160" text-anchor="middle" fill="#888">40</text>
  </g>

  <!-- índices -->
  <g font-size="14" fill="#888">
    <text x="98"  y="200" text-anchor="middle">0</text>
    <text x="182" y="200" text-anchor="middle">1</text>
    <text x="266" y="200" text-anchor="middle">2</text>
    <text x="350" y="200" text-anchor="middle">3</text>
    <text x="434" y="200" text-anchor="middle">4</text>
    <text x="518" y="200" text-anchor="middle">5</text>
    <text x="602" y="200" text-anchor="middle">6</text>
  </g>

  <!-- ================= BUSCA BINÁRIA ================= -->
  <text x="60" y="254" font-size="16" font-weight="600" fill="#2c5d8a">Busca binária</text>
  <text x="640" y="254" text-anchor="end" font-size="15" fill="#5a7a9a">2 comparações</text>

  <!-- ordem de visita -->
  <text x="350" y="286" text-anchor="middle" font-size="14" font-weight="600" fill="#2c5d8a">1ª</text>
  <text x="518" y="286" text-anchor="middle" font-size="14" font-weight="600" fill="#2c5d8a">2ª ✓</text>

  <!-- células: 0–2 descartadas (tracejadas), 3 examinada, 4 e 6 nunca examinadas, 5 encontrada -->
  <rect x="60"  y="294" width="76" height="54" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="2" stroke-dasharray="6,4" rx="4"/>
  <rect x="144" y="294" width="76" height="54" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="2" stroke-dasharray="6,4" rx="4"/>
  <rect x="228" y="294" width="76" height="54" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="2" stroke-dasharray="6,4" rx="4"/>
  <rect x="312" y="294" width="76" height="54" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <rect x="396" y="294" width="76" height="54" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="2" rx="4"/>
  <rect x="480" y="294" width="76" height="54" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2.5" rx="4"/>
  <rect x="564" y="294" width="76" height="54" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="2" rx="4"/>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#222">
    <text x="98"  y="328" text-anchor="middle" fill="#888">3</text>
    <text x="182" y="328" text-anchor="middle" fill="#888">8</text>
    <text x="266" y="328" text-anchor="middle" fill="#888">12</text>
    <text x="350" y="328" text-anchor="middle">17</text>
    <text x="434" y="328" text-anchor="middle" fill="#888">25</text>
    <text x="518" y="328" text-anchor="middle" font-weight="600">31</text>
    <text x="602" y="328" text-anchor="middle" fill="#888">40</text>
  </g>

  <!-- índices -->
  <g font-size="14" fill="#888">
    <text x="98"  y="368" text-anchor="middle">0</text>
    <text x="182" y="368" text-anchor="middle">1</text>
    <text x="266" y="368" text-anchor="middle">2</text>
    <text x="350" y="368" text-anchor="middle">3</text>
    <text x="434" y="368" text-anchor="middle">4</text>
    <text x="518" y="368" text-anchor="middle">5</text>
    <text x="602" y="368" text-anchor="middle">6</text>
  </g>

  <text x="182" y="394" text-anchor="middle" font-size="14" fill="#888" font-style="italic">
    descartadas na 1ª comparação (17 &lt; 31)
  </text>

  <line x1="100" y1="414" x2="600" y2="414" stroke="#cfd6dd" stroke-width="1"/>
  <text x="350" y="440" text-anchor="middle"
        font-size="14" fill="#5a7a9a" font-style="italic">
    cada comparação da binária descarta metade dos candidatos restantes
  </text>
</svg>
