<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 700 365"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <text x="350" y="32" text-anchor="middle"
        font-size="18" font-weight="600" fill="#2c5d8a">As três contagens sobre o mesmo vetor</text>

  <line x1="80" y1="250" x2="620" y2="250" stroke="#cfd6dd" stroke-width="1.5"/>
  <rect x="137" y="96" width="96" height="154" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2.5" rx="3"/>
  <text x="185" y="84" text-anchor="middle" font-size="22" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#2c5d8a">27</text>
  <text x="185" y="274" text-anchor="middle" font-size="15" fill="#222">bubble sort</text>
  <rect x="302" y="153" width="96" height="97" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2.5" rx="3"/>
  <text x="350" y="141" text-anchor="middle" font-size="22" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#2c5d8a">17</text>
  <text x="350" y="274" text-anchor="middle" font-size="15" fill="#222">merge sort</text>
  <rect x="467" y="170" width="96" height="80" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2.5" rx="3"/>
  <text x="515" y="158" text-anchor="middle" font-size="22" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#2c5d8a">14</text>
  <text x="515" y="274" text-anchor="middle" font-size="15" fill="#222">quick sort</text>
  <text x="350" y="298" text-anchor="middle" font-size="13" fill="#888">comparações para n = 8</text>

  <line x1="60" y1="320" x2="640" y2="320" stroke="#cfd6dd" stroke-width="1"/>
  <text x="350" y="346" text-anchor="middle"
        font-size="14" fill="#5a7a9a" font-style="italic">com oito elementos a diferença é pequena · ela cresce com n</text>
</svg>
