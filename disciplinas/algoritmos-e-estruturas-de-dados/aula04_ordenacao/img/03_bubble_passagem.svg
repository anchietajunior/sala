  <text x="48" y="68" text-anchor="start" font-size="13" fill="#5a7a9a" font-weight="400">antes</text>

  <rect x="48" y="76" width="72" height="56" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <rect x="125" y="76" width="72" height="56" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <rect x="202" y="76" width="72" height="56" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="3.5" rx="4"/>
  <rect x="279" y="76" width="72" height="56" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <rect x="356" y="76" width="72" height="56" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <rect x="433" y="76" width="72" height="56" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <rect x="510" y="76" width="72" height="56" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <rect x="587" y="76" width="72" height="56" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#222">
    <text x="84" y="111" text-anchor="middle" font-weight="400" fill="#222">7</text>
    <text x="161" y="111" text-anchor="middle" font-weight="400" fill="#222">3</text>
    <text x="238" y="111" text-anchor="middle" font-weight="700" fill="#222">9</text>
    <text x="315" y="111" text-anchor="middle" font-weight="400" fill="#222">1</text>
    <text x="392" y="111" text-anchor="middle" font-weight="400" fill="#222">5</text>
    <text x="469" y="111" text-anchor="middle" font-weight="400" fill="#222">8</text>
    <text x="546" y="111" text-anchor="middle" font-weight="400" fill="#222">2</text>
    <text x="623" y="111" text-anchor="middle" font-weight="400" fill="#222">6</text>
  </g>

  <path d="M 84.0 136 Q 122.5 160, 161.0 136" fill="none" stroke="#5a7a9a" stroke-width="1.5"/>
  <text x="122.5" y="170" text-anchor="middle" font-size="12" fill="#5a7a9a">1</text>
  <path d="M 161.0 136 Q 199.5 160, 238.0 136" fill="none" stroke="#5a7a9a" stroke-width="1.5"/>
  <text x="199.5" y="170" text-anchor="middle" font-size="12" fill="#5a7a9a">2</text>
  <path d="M 238.0 136 Q 276.5 160, 315.0 136" fill="none" stroke="#5a7a9a" stroke-width="1.5"/>
  <text x="276.5" y="170" text-anchor="middle" font-size="12" fill="#5a7a9a">3</text>
  <path d="M 315.0 136 Q 353.5 160, 392.0 136" fill="none" stroke="#5a7a9a" stroke-width="1.5"/>
