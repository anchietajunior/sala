  <path d="M 469.0 136 Q 507.5 160, 546.0 136" fill="none" stroke="#5a7a9a" stroke-width="1.5"/>
  <text x="507.5" y="170" text-anchor="middle" font-size="12" fill="#5a7a9a">6</text>
  <path d="M 546.0 136 Q 584.5 160, 623.0 136" fill="none" stroke="#5a7a9a" stroke-width="1.5"/>
