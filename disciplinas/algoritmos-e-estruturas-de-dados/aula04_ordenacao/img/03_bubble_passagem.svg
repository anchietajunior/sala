  <text x="48" y="208" text-anchor="start" font-size="13" fill="#5a7a9a" font-weight="400">depois da passagem 1</text>

  <rect x="48" y="216" width="72" height="56" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <rect x="125" y="216" width="72" height="56" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <rect x="202" y="216" width="72" height="56" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <rect x="279" y="216" width="72" height="56" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <rect x="356" y="216" width="72" height="56" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <rect x="433" y="216" width="72" height="56" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <rect x="510" y="216" width="72" height="56" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <rect x="587" y="216" width="72" height="56" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="3.5" rx="4"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#222">
    <text x="84" y="251" text-anchor="middle" font-weight="400" fill="#222">3</text>
    <text x="161" y="251" text-anchor="middle" font-weight="400" fill="#222">7</text>
    <text x="238" y="251" text-anchor="middle" font-weight="400" fill="#222">1</text>
    <text x="315" y="251" text-anchor="middle" font-weight="400" fill="#222">5</text>
    <text x="392" y="251" text-anchor="middle" font-weight="400" fill="#222">8</text>
    <text x="469" y="251" text-anchor="middle" font-weight="400" fill="#222">2</text>
    <text x="546" y="251" text-anchor="middle" font-weight="400" fill="#222">6</text>
    <text x="623" y="251" text-anchor="middle" font-weight="700" fill="#222">9</text>
  </g>
  <text x="623" y="296" text-anchor="middle" font-size="12" fill="#2c5d8a" font-weight="600">resolvida</text>

  <line x1="60" y1="312" x2="640" y2="312" stroke="#cfd6dd" stroke-width="1"/>
  <text x="350" y="338" text-anchor="middle"
        font-size="14" fill="#5a7a9a" font-style="italic">sete comparações · o 9 foi arrastado até o fim e não se move mais</text>
