<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 385"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="700" height="385" fill="#ffffff"/>
  <text x="350.0" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#2c5d8a">Autorreferência: o campo proximo guarda um endereço, não um nó</text>
  <line x1="345" y1="65" x2="345" y2="300" stroke="#cfd6dd" stroke-width="1.5"/>
  <text x="180" y="80" text-anchor="middle" font-size="16" fill="#222" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">struct No proximo;</text>
  <text x="180" y="104" text-anchor="middle" font-size="14" fill="#b54040" font-style="italic" xml:space="preserve">rejeitado pelo compilador</text>
  <rect x="30" y="125" width="290" height="150" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <text x="75" y="205.0" text-anchor="middle" font-size="14" fill="#222" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">valor</text>
  <rect x="120" y="140" width="190" height="120" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <text x="165" y="205.0" text-anchor="middle" font-size="14" fill="#222" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">valor</text>
  <rect x="205" y="155" width="95" height="90" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <text x="252" y="206" text-anchor="middle" font-size="22" fill="#2c5d8a" font-weight="600" xml:space="preserve">…</text>
  <text x="180" y="300" text-anchor="middle" font-size="14" fill="#5a7a9a" font-style="italic" xml:space="preserve">um nó dentro do outro, sem fim: tamanho infinito</text>
  <text x="520" y="80" text-anchor="middle" font-size="16" fill="#222" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">struct No* proximo;</text>
  <text x="520" y="104" text-anchor="middle" font-size="14" fill="#2c5d8a" font-weight="600" font-style="italic" xml:space="preserve">correto</text>
  <rect x="375" y="170" width="120" height="60" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <line x1="455" y1="170" x2="455" y2="230" stroke="#2c5d8a" stroke-width="2"/>
  <text x="415" y="208" text-anchor="middle" font-size="22" fill="#222" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">10</text>
  <circle cx="475" cy="200" r="4" fill="#2c5d8a"/>
  <path d="M 475 200 L 536.0 200.0" fill="none" stroke="#2c5d8a" stroke-width="2.5"/><polygon points="544.0,200.0 532.0,194.5 532.0,205.5" fill="#2c5d8a"/>
  <rect x="545" y="170" width="120" height="60" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <line x1="625" y1="170" x2="625" y2="230" stroke="#2c5d8a" stroke-width="2"/>
  <text x="585" y="208" text-anchor="middle" font-size="22" fill="#222" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">20</text>
  <text x="645" y="207" text-anchor="middle" font-size="18" fill="#888" xml:space="preserve">∅</text>
  <text x="520" y="300" text-anchor="middle" font-size="14" fill="#5a7a9a" font-style="italic" xml:space="preserve">o campo guarda só um endereço: tamanho fixo</text>
  <line x1="60" y1="325" x2="640" y2="325" stroke="#cfd6dd" stroke-width="1"/>
  <text x="350.0" y="351" text-anchor="middle" font-size="14" fill="#5a7a9a" font-style="italic" xml:space="preserve">dentro das chaves, o nome curto No ainda não existe — por isso o campo usa struct No*</text>
  <text x="350.0" y="373" text-anchor="middle" font-size="14" fill="#5a7a9a" font-style="italic" xml:space="preserve">a autorreferência não cria nós: só permite que proximo guarde o endereço de outro nó</text>
</svg>
