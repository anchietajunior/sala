<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 700 340"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <!-- vermelho sobrio #b54040 apenas para a estrategia que cresce sem limite -->

  <text x="350" y="32" text-anchor="middle"
        font-size="18" font-weight="600" fill="#2c5d8a">Quando ordenar passa a compensar</text>

  <!-- eixos -->
  <path d="M 90 272 L 640 272" fill="none" stroke="#5a7a9a" stroke-width="2"/>
  <polygon points="635,267 648,272 635,277" fill="#5a7a9a"/>
  <path d="M 90 272 L 90 62" fill="none" stroke="#5a7a9a" stroke-width="2"/>
  <polygon points="85,67 90,54 95,67" fill="#5a7a9a"/>

  <text x="370" y="306" text-anchor="middle" font-size="14" fill="#5a7a9a">k — número de consultas</text>
  <text x="82" y="50" text-anchor="end" font-size="14" fill="#5a7a9a">custo total acumulado</text>

  <!-- linear: k * n, sobe rapido desde a origem -->
  <path d="M 90 272 L 470 72" fill="none" stroke="#b54040" stroke-width="3"/>
  <text x="478" y="74" font-size="14" font-weight="700" fill="#b54040">só busca linear</text>

  <!-- ordenar + binaria: comeca alto (custo da ordenacao) e sobe devagar -->
  <path d="M 90 170 L 620 138" fill="none" stroke="#2c5d8a" stroke-width="3"/>
  <text x="452" y="128" font-size="14" font-weight="700" fill="#2c5d8a">ordenar + binária</text>

  <!-- custo inicial da ordenacao -->
  <path d="M 74 170 L 74 272" fill="none" stroke="#5a7a9a" stroke-width="1.5"/>
  <path d="M 70 170 L 78 170" fill="none" stroke="#5a7a9a" stroke-width="1.5"/>
  <path d="M 70 272 L 78 272" fill="none" stroke="#5a7a9a" stroke-width="1.5"/>
  <text x="64" y="228" text-anchor="end" font-size="12.5" fill="#5a7a9a">custo da</text>
  <text x="64" y="244" text-anchor="end" font-size="12.5" fill="#5a7a9a">ordenação</text>

  <!-- cruzamento -->
  <circle cx="284" cy="170" r="6" fill="#2c5d8a"/>
  <path d="M 284 170 L 284 272" fill="none" stroke="#2c5d8a" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="284" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5d8a">≈ log₂ n</text>
  <text x="300" y="162" font-size="13" font-weight="600" fill="#2c5d8a">ponto de equilíbrio</text>

  <!-- rotulos das regioes -->
  <text x="180" y="252" text-anchor="middle" font-size="12.5" fill="#b54040">linear ainda ganha</text>
  <text x="470" y="252" text-anchor="middle" font-size="12.5" fill="#2c5d8a">binária ganha, e cada vez mais</text>

  <text x="350" y="330" text-anchor="middle"
        font-size="14" fill="#5a7a9a" font-style="italic">
    ordenar é investimento: caro na primeira consulta, diluído a partir da vigésima
  </text>
</svg>
