<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 700 260"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <text x="350" y="34" text-anchor="middle"
        font-size="18" font-weight="600" fill="#2c5d8a">busca_binaria(vetor, 55) — o primeiro meio</text>

  <!-- meio = 3 sobre a posição 3 -->
  <text x="315" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#2c5d8a"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">meio = 3</text>
  <path d="M 315 74 L 315 87" fill="none" stroke="#2c5d8a" stroke-width="2.5"/>
  <polygon points="310,84 315,96 320,84" fill="#2c5d8a"/>

  <!-- células: trecho inteiro vivo, meio destacado -->
  <rect x="48"  y="90" width="72" height="56" fill="#e8f0f8" stroke="#5a7a9a" stroke-width="2" rx="4"/>
  <rect x="125" y="90" width="72" height="56" fill="#e8f0f8" stroke="#5a7a9a" stroke-width="2" rx="4"/>
  <rect x="202" y="90" width="72" height="56" fill="#e8f0f8" stroke="#5a7a9a" stroke-width="2" rx="4"/>
  <rect x="279" y="90" width="72" height="56" fill="#cfe0f2" stroke="#2c5d8a" stroke-width="3" rx="4"/>
  <rect x="356" y="90" width="72" height="56" fill="#e8f0f8" stroke="#5a7a9a" stroke-width="2" rx="4"/>
  <rect x="433" y="90" width="72" height="56" fill="#e8f0f8" stroke="#5a7a9a" stroke-width="2" rx="4"/>
  <rect x="510" y="90" width="72" height="56" fill="#e8f0f8" stroke="#5a7a9a" stroke-width="2" rx="4"/>
  <rect x="587" y="90" width="72" height="56" fill="#e8f0f8" stroke="#5a7a9a" stroke-width="2" rx="4"/>

  <!-- valores -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#222">
    <text x="84"  y="126" text-anchor="middle">4</text>
    <text x="161" y="126" text-anchor="middle">8</text>
    <text x="238" y="126" text-anchor="middle">15</text>
    <text x="315" y="126" text-anchor="middle" font-weight="700" fill="#2c5d8a">16</text>
    <text x="392" y="126" text-anchor="middle">23</text>
    <text x="469" y="126" text-anchor="middle">42</text>
    <text x="546" y="126" text-anchor="middle">55</text>
    <text x="623" y="126" text-anchor="middle">68</text>
  </g>

  <!-- índices -->
  <text x="36" y="176" text-anchor="end" font-size="13" fill="#888">índice</text>
  <g font-size="14" fill="#888">
    <text x="84"  y="176" text-anchor="middle">0</text>
    <text x="161" y="176" text-anchor="middle">1</text>
    <text x="238" y="176" text-anchor="middle">2</text>
    <text x="315" y="176" text-anchor="middle" font-weight="700" fill="#2c5d8a">3</text>
    <text x="392" y="176" text-anchor="middle">4</text>
    <text x="469" y="176" text-anchor="middle">5</text>
    <text x="546" y="176" text-anchor="middle">6</text>
    <text x="623" y="176" text-anchor="middle">7</text>
  </g>

  <!-- marcadores inicio / fim -->
  <text x="84"  y="198" text-anchor="middle" font-size="13" font-weight="600" fill="#2c5d8a">inicio</text>
  <text x="623" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="#2c5d8a">fim</text>

  <line x1="60" y1="216" x2="640" y2="216" stroke="#cfd6dd" stroke-width="1"/>
  <text x="350" y="242" text-anchor="middle"
        font-size="14" fill="#5a7a9a" font-style="italic">
    inicio = 0, fim = 7 → meio = (0 + 7) / 2 = 3 · compara vetor[3] = 16 com 55
  </text>
</svg>
