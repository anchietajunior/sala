<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 700 300"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <text x="350" y="36" text-anchor="middle"
        font-size="18" font-weight="600" fill="#2c5d8a">Lista sequencial (vetor) — uma rua de casas numeradas</text>

  <!-- acesso direto -->
  <text x="438" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#2c5d8a"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">notas[3] → 90</text>
  <path d="M 438 84 L 438 102" fill="none" stroke="#2c5d8a" stroke-width="2.5"/>
  <polygon points="433,99 438,112 443,99" fill="#2c5d8a"/>

  <!-- células (5 × 76px, gap 8, x0=144) -->
  <text x="130" y="150" text-anchor="end" font-size="14" fill="#5a7a9a"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">notas</text>
  <rect x="144" y="116" width="76" height="54" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <rect x="228" y="116" width="76" height="54" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <rect x="312" y="116" width="76" height="54" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <rect x="396" y="116" width="76" height="54" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2.5" rx="4"/>
  <rect x="480" y="116" width="76" height="54" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#222">
    <text x="182" y="150" text-anchor="middle">80</text>
    <text x="266" y="150" text-anchor="middle">65</text>
    <text x="350" y="150" text-anchor="middle">72</text>
    <text x="438" y="150" text-anchor="middle" font-weight="600">90</text>
    <text x="518" y="150" text-anchor="middle">95</text>
  </g>

  <!-- índices -->
  <text x="130" y="192" text-anchor="end" font-size="14" fill="#888">índice</text>
  <g font-size="14" fill="#888">
    <text x="182" y="192" text-anchor="middle">0</text>
    <text x="266" y="192" text-anchor="middle">1</text>
    <text x="350" y="192" text-anchor="middle">2</text>
    <text x="438" y="192" text-anchor="middle" font-weight="600" fill="#2c5d8a">3</text>
    <text x="518" y="192" text-anchor="middle">4</text>
  </g>

  <!-- contiguidade na memória -->
  <line x1="144" y1="210" x2="556" y2="210" stroke="#5a7a9a" stroke-width="1.5"/>
  <line x1="144" y1="204" x2="144" y2="210" stroke="#5a7a9a" stroke-width="1.5"/>
  <line x1="556" y1="204" x2="556" y2="210" stroke="#5a7a9a" stroke-width="1.5"/>
  <text x="350" y="232" text-anchor="middle" font-size="14" fill="#5a7a9a" font-style="italic">
    posições vizinhas na memória, sem espaços vazios
  </text>

  <line x1="100" y1="256" x2="600" y2="256" stroke="#cfd6dd" stroke-width="1"/>
  <text x="350" y="282" text-anchor="middle"
        font-size="14" fill="#5a7a9a" font-style="italic">
    mesmo tipo · lado a lado · acesso direto pelo índice — custa o mesmo em qualquer posição
  </text>
</svg>
