  <text x="544" y="186" text-anchor="start" font-size="16" fill="#2c5d8a" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">3 * 4 = 12</text>
  <text x="414" y="76" text-anchor="start" font-size="16" fill="#2c5d8a" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">2 + 12 = 14</text>
  <line x1="100" y1="335" x2="600" y2="335" stroke="#cfd6dd" stroke-width="1"/>
  <text x="350" y="360" text-anchor="middle" font-size="14" fill="#5a7a9a" font-style="italic">pós-ordem: cada operador é calculado depois dos seus dois operandos</text>
