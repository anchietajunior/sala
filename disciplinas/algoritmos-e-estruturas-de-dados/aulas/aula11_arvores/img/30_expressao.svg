  <circle cx="480" cy="180" r="28" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2"/>
  <text x="480" y="187" text-anchor="middle" font-size="20" fill="#222" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">*</text>
  <circle cx="350" cy="70" r="28" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2"/>
  <text x="350" y="77" text-anchor="middle" font-size="20" fill="#222" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">+</text>
  <circle cx="262" cy="180" r="13" fill="#2c5d8a"/>
  <text x="262" y="185" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">1</text>
