<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 700 260"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <text x="350" y="34" text-anchor="middle"
        font-size="18" font-weight="600" fill="#2c5d8a">busca_binaria(vetor, 55) — o encontro</text>

  <!-- rótulos dos três meios examinados -->
  <g font-size="12.5" fill="#5a7a9a">
    <text x="315" y="78" text-anchor="middle">1º meio</text>
    <text x="469" y="78" text-anchor="middle">2º meio</text>
    <text x="546" y="78" text-anchor="middle" font-weight="700" fill="#2c5d8a">3º meio ✓</text>
  </g>

  <!-- 0..3 descartados no passo 1 -->
  <rect x="48"  y="90" width="72" height="56" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="2" stroke-dasharray="6,4" rx="4"/>
  <rect x="125" y="90" width="72" height="56" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="2" stroke-dasharray="6,4" rx="4"/>
  <rect x="202" y="90" width="72" height="56" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="2" stroke-dasharray="6,4" rx="4"/>
  <rect x="279" y="90" width="72" height="56" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="2" stroke-dasharray="6,4" rx="4"/>
  <!-- 4..5 descartados no passo 2 -->
  <rect x="356" y="90" width="72" height="56" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="2" stroke-dasharray="6,4" rx="4"/>
  <rect x="433" y="90" width="72" height="56" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="2" stroke-dasharray="6,4" rx="4"/>
  <!-- 6 encontrada -->
  <rect x="510" y="90" width="72" height="56" fill="#cfe0f2" stroke="#2c5d8a" stroke-width="3" rx="4"/>
  <!-- 7 sob suspeita, não precisou ser lida -->
  <rect x="587" y="90" width="72" height="56" fill="#e8f0f8" stroke="#5a7a9a" stroke-width="2" rx="4"/>

  <!-- valores -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20">
    <text x="84"  y="126" text-anchor="middle" fill="#aab3bd">4</text>
    <text x="161" y="126" text-anchor="middle" fill="#aab3bd">8</text>
    <text x="238" y="126" text-anchor="middle" fill="#aab3bd">15</text>
    <text x="315" y="126" text-anchor="middle" fill="#aab3bd">16</text>
    <text x="392" y="126" text-anchor="middle" fill="#aab3bd">23</text>
    <text x="469" y="126" text-anchor="middle" fill="#aab3bd">42</text>
    <text x="546" y="126" text-anchor="middle" fill="#2c5d8a" font-weight="700">55</text>
    <text x="623" y="126" text-anchor="middle" fill="#222">68</text>
  </g>

  <!-- índices -->
  <text x="36" y="176" text-anchor="end" font-size="13" fill="#888">índice</text>
  <g font-size="14" fill="#888">
    <text x="84"  y="176" text-anchor="middle">0</text>
    <text x="161" y="176" text-anchor="middle">1</text>
    <text x="238" y="176" text-anchor="middle">2</text>
    <text x="315" y="176" text-anchor="middle">3</text>
    <text x="392" y="176" text-anchor="middle">4</text>
    <text x="469" y="176" text-anchor="middle">5</text>
    <text x="546" y="176" text-anchor="middle" font-weight="700" fill="#2c5d8a">6</text>
    <text x="623" y="176" text-anchor="middle">7</text>
  </g>

  <line x1="60" y1="206" x2="640" y2="206" stroke="#cfd6dd" stroke-width="1"/>
  <text x="350" y="232" text-anchor="middle"
        font-size="14" fill="#5a7a9a" font-style="italic">
    trecho [0..7] → [4..7] → [6..7] · 3 comparações contra as 7 da busca linear
  </text>
</svg>
