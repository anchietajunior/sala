<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 700 260"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <text x="350" y="34" text-anchor="middle"
        font-size="18" font-weight="600" fill="#2c5d8a">busca_binaria(vetor, 55) — descarte da metade</text>

  <text x="238" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#888">16 &lt; 55 → metade esquerda fora</text>

  <!-- células 0..3 descartadas -->
  <g>
    <rect x="48"  y="90" width="72" height="56" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="2" stroke-dasharray="6,4" rx="4"/>
    <rect x="125" y="90" width="72" height="56" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="2" stroke-dasharray="6,4" rx="4"/>
    <rect x="202" y="90" width="72" height="56" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="2" stroke-dasharray="6,4" rx="4"/>
    <rect x="279" y="90" width="72" height="56" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="2" stroke-dasharray="6,4" rx="4"/>
    <line x1="54"  y1="94" x2="114" y2="142" stroke="#cfd6dd" stroke-width="2"/>
    <line x1="131" y1="94" x2="191" y2="142" stroke="#cfd6dd" stroke-width="2"/>
    <line x1="208" y1="94" x2="268" y2="142" stroke="#cfd6dd" stroke-width="2"/>
    <line x1="285" y1="94" x2="345" y2="142" stroke="#cfd6dd" stroke-width="2"/>
  </g>

  <!-- células 4..7 vivas -->
  <rect x="356" y="90" width="72" height="56" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2.5" rx="4"/>
  <rect x="433" y="90" width="72" height="56" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2.5" rx="4"/>
  <rect x="510" y="90" width="72" height="56" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2.5" rx="4"/>
  <rect x="587" y="90" width="72" height="56" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2.5" rx="4"/>

  <!-- valores -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20">
    <text x="84"  y="126" text-anchor="middle" fill="#aab3bd">4</text>
    <text x="161" y="126" text-anchor="middle" fill="#aab3bd">8</text>
    <text x="238" y="126" text-anchor="middle" fill="#aab3bd">15</text>
    <text x="315" y="126" text-anchor="middle" fill="#aab3bd">16</text>
    <text x="392" y="126" text-anchor="middle" fill="#222">23</text>
    <text x="469" y="126" text-anchor="middle" fill="#222">42</text>
    <text x="546" y="126" text-anchor="middle" fill="#222">55</text>
    <text x="623" y="126" text-anchor="middle" fill="#222">68</text>
  </g>

  <!-- índices -->
  <text x="36" y="176" text-anchor="end" font-size="13" fill="#888">índice</text>
  <g font-size="14" fill="#888">
    <text x="84"  y="176" text-anchor="middle">0</text>
    <text x="161" y="176" text-anchor="middle">1</text>
    <text x="238" y="176" text-anchor="middle">2</text>
    <text x="315" y="176" text-anchor="middle">3</text>
    <text x="392" y="176" text-anchor="middle" font-weight="700" fill="#2c5d8a">4</text>
    <text x="469" y="176" text-anchor="middle">5</text>
    <text x="546" y="176" text-anchor="middle">6</text>
    <text x="623" y="176" text-anchor="middle">7</text>
  </g>

  <!-- novo inicio -->
  <text x="392" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="#2c5d8a">inicio = 4</text>
  <text x="623" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="#2c5d8a">fim</text>

  <line x1="60" y1="216" x2="640" y2="216" stroke="#cfd6dd" stroke-width="1"/>
  <text x="350" y="242" text-anchor="middle"
        font-size="14" fill="#5a7a9a" font-style="italic">
    metade do vetor sai do jogo com UMA comparação · sobra o trecho [4..7]
  </text>
</svg>
