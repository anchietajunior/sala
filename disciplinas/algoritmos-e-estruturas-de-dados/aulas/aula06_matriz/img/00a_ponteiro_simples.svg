<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <text x="350" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#2c5d8a">
    Ponteiro simples — guarda o endereco de um inteiro
  </text>

  <!-- ===== Lado esquerdo: o ponteiro p ===== -->
  <text x="160" y="92" text-anchor="middle" font-size="14" fill="#5a7a9a" font-style="italic">
    p (tipo int*)
  </text>
  <rect x="80" y="105" width="160" height="60" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2.5" rx="4"/>
  <text x="160" y="142" text-anchor="middle" font-size="16" fill="#222"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    endereco de x
  </text>
  <circle cx="240" cy="135" r="4" fill="#2c5d8a"/>

  <text x="160" y="200" text-anchor="middle" font-size="13" fill="#888">
    guarda o endereco
  </text>
  <text x="160" y="218" text-anchor="middle" font-size="13" fill="#888">
    de outra variavel
  </text>

  <!-- ===== Seta de p para x ===== -->
  <path d="M 240 135 L 437 135" fill="none" stroke="#2c5d8a" stroke-width="2.5"/>
  <polygon points="430,130 443,135 430,140" fill="#2c5d8a"/>

  <!-- ===== Lado direito: o inteiro x ===== -->
  <text x="525" y="92" text-anchor="middle" font-size="14" fill="#5a7a9a" font-style="italic">
    x (tipo int)
  </text>
  <rect x="445" y="105" width="160" height="60" fill="#f7f9fc" stroke="#2c5d8a" stroke-width="2.5" rx="4"/>
  <text x="525" y="146" text-anchor="middle" font-size="22" fill="#222"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">42</text>

  <text x="525" y="200" text-anchor="middle" font-size="13" fill="#888">
    guarda um numero
  </text>

  <!-- Nota -->
  <line x1="80" y1="245" x2="620" y2="245" stroke="#cfd6dd" stroke-width="1"/>
  <text x="350" y="268" text-anchor="middle" font-size="13" fill="#5a7a9a" font-style="italic">
    Para ler o numero atraves de p: *p devolve 42.
  </text>
</svg>
