<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <text x="350" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#2c5d8a">
    Passo 6 — matriz_obter(2, 3) devolve 5
  </text>

  <text x="215" y="80" text-anchor="end" font-size="13" fill="#5a7a9a" font-style="italic">j =</text>
  <text x="260" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#5a7a9a">0</text>
  <text x="320" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#5a7a9a">1</text>
  <text x="380" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#5a7a9a">2</text>
  <text x="440" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#5a7a9a">3</text>

  <!-- Linha 0 -->
  <text x="215" y="125" text-anchor="end" font-size="14" font-weight="600" fill="#5a7a9a">i = 0</text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    <rect x="230" y="95" width="60" height="50" fill="#f7f9fc" stroke="#2c5d8a" stroke-width="2" rx="3"/>
    <text x="260" y="128" text-anchor="middle" font-size="20" fill="#222">0</text>
    <rect x="290" y="95" width="60" height="50" fill="#f7f9fc" stroke="#2c5d8a" stroke-width="2" rx="3"/>
    <text x="320" y="128" text-anchor="middle" font-size="20" fill="#222">7</text>
    <rect x="350" y="95" width="60" height="50" fill="#f7f9fc" stroke="#2c5d8a" stroke-width="2" rx="3"/>
    <text x="380" y="128" text-anchor="middle" font-size="20" fill="#222">0</text>
    <rect x="410" y="95" width="60" height="50" fill="#f7f9fc" stroke="#2c5d8a" stroke-width="2" rx="3"/>
    <text x="440" y="128" text-anchor="middle" font-size="20" fill="#222">0</text>
  </g>

  <!-- Linha 1 -->
  <text x="215" y="180" text-anchor="end" font-size="14" font-weight="600" fill="#5a7a9a">i = 1</text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    <rect x="230" y="150" width="60" height="50" fill="#f7f9fc" stroke="#2c5d8a" stroke-width="2" rx="3"/>
    <text x="260" y="183" text-anchor="middle" font-size="20" fill="#222">9</text>
    <rect x="290" y="150" width="60" height="50" fill="#f7f9fc" stroke="#2c5d8a" stroke-width="2" rx="3"/>
    <text x="320" y="183" text-anchor="middle" font-size="20" fill="#222">0</text>
    <rect x="350" y="150" width="60" height="50" fill="#f7f9fc" stroke="#2c5d8a" stroke-width="2" rx="3"/>
    <text x="380" y="183" text-anchor="middle" font-size="20" fill="#222">0</text>
    <rect x="410" y="150" width="60" height="50" fill="#f7f9fc" stroke="#2c5d8a" stroke-width="2" rx="3"/>
    <text x="440" y="183" text-anchor="middle" font-size="20" fill="#222">0</text>
  </g>

  <!-- Linha 2 — celula (2,3) destacada com caixa pontilhada (leitura) -->
  <text x="215" y="235" text-anchor="end" font-size="14" font-weight="600" fill="#5a7a9a">i = 2</text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    <rect x="230" y="205" width="60" height="50" fill="#f7f9fc" stroke="#2c5d8a" stroke-width="2" rx="3"/>
    <text x="260" y="238" text-anchor="middle" font-size="20" fill="#222">0</text>
    <rect x="290" y="205" width="60" height="50" fill="#f7f9fc" stroke="#2c5d8a" stroke-width="2" rx="3"/>
    <text x="320" y="238" text-anchor="middle" font-size="20" fill="#222">0</text>
    <rect x="350" y="205" width="60" height="50" fill="#f7f9fc" stroke="#2c5d8a" stroke-width="2" rx="3"/>
    <text x="380" y="238" text-anchor="middle" font-size="20" fill="#222">0</text>
    <!-- caixa pontilhada de leitura -->
    <rect x="410" y="205" width="60" height="50" fill="#f7f9fc" stroke="#2c5d8a" stroke-width="2.5"
          stroke-dasharray="6,4" rx="3"/>
    <text x="440" y="238" text-anchor="middle" font-size="22" font-weight="700" fill="#2c5d8a">5</text>
  </g>

  <!-- Seta de leitura: olho com indicacao "le" -->
  <text x="540" y="237" font-size="14" fill="#2c5d8a" font-weight="600">le ↓ 5</text>
  <path d="M 530 234 L 478 234" fill="none" stroke="#2c5d8a" stroke-width="2"
        stroke-dasharray="5,3"/>
  <polygon points="483,229 472,234 483,239" fill="#2c5d8a"/>

  <!-- Nota de rodape -->
  <line x1="100" y1="285" x2="600" y2="285" stroke="#cfd6dd" stroke-width="1"/>
  <text x="350" y="310" text-anchor="middle" font-size="13" fill="#5a7a9a" font-style="italic">
    operacao de leitura · nao altera a matriz · devolve o ultimo valor gravado em (2, 3)
  </text>
</svg>
