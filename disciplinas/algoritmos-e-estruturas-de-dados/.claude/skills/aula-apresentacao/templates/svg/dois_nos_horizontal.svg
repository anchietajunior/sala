<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <text x="350" y="40" text-anchor="middle" font-size="18" font-weight="600" fill="#2c5d8a">
    Passo N — operacao(VALOR)
  </text>

  <!-- Rotulo inicio (esquerda) -->
  <text x="155" y="125" text-anchor="end" font-size="14" font-weight="600" fill="#2c5d8a">inicio →</text>

  <!-- No 1: VALOR_A -->
  <rect x="170" y="100" width="120" height="60" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <line x1="250" y1="100" x2="250" y2="160" stroke="#2c5d8a" stroke-width="2"/>
  <text x="210" y="138" text-anchor="middle" font-size="22" fill="#222"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">A</text>
  <circle cx="270" cy="130" r="3.5" fill="#2c5d8a"/>

  <!-- Seta horizontal entre A e B -->
  <path d="M 290 130 L 360 130" fill="none" stroke="#2c5d8a" stroke-width="2.5"/>
  <polygon points="355,125 368,130 355,135" fill="#2c5d8a"/>

  <!-- No 2: VALOR_B (em destaque por ser o mais recente) -->
  <rect x="370" y="100" width="120" height="60" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2.5" rx="4"/>
  <line x1="450" y1="100" x2="450" y2="160" stroke="#2c5d8a" stroke-width="2"/>
  <text x="410" y="138" text-anchor="middle" font-size="22" fill="#222"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">B</text>
  <text x="470" y="138" text-anchor="middle" font-size="14" fill="#888">∅</text>

  <!-- Rotulo fim (direita) -->
  <text x="540" y="125" text-anchor="start" font-size="14" font-weight="600" fill="#2c5d8a">← fim</text>

  <line x1="100" y1="200" x2="600" y2="200" stroke="#cfd6dd" stroke-width="1"/>
  <text x="350" y="230" text-anchor="middle" font-size="13" fill="#5a7a9a" font-style="italic">
    novo no entrou pelo fim · fim aponta para ele
  </text>
</svg>
