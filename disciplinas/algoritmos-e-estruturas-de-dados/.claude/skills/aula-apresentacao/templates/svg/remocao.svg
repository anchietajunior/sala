<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <text x="350" y="40" text-anchor="middle" font-size="18" font-weight="600" fill="#2c5d8a">
    Passo N — desempilhar() remove TOPO
  </text>

  <!-- No removido (em cima): em cinza/tracejado para mostrar que saiu -->
  <rect x="430" y="100" width="120" height="60" fill="#f7f9fc"
        stroke="#cfd6dd" stroke-width="2" stroke-dasharray="6,4" rx="4"/>
  <line x1="510" y1="100" x2="510" y2="160" stroke="#cfd6dd" stroke-width="2"
        stroke-dasharray="4,3"/>
  <text x="470" y="138" text-anchor="middle" font-size="22" fill="#888"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">REMOVIDO</text>
  <!-- "x" indicando que foi liberado -->
  <line x1="555" y1="100" x2="585" y2="130" stroke="#b54040" stroke-width="2"/>
  <line x1="555" y1="130" x2="585" y2="100" stroke="#b54040" stroke-width="2"/>
  <text x="565" y="178" font-size="12" fill="#b54040" font-style="italic">free</text>

  <!-- topo agora aponta para o no que ficou -->
  <text x="200" y="125" text-anchor="end" font-size="14" font-weight="600" fill="#2c5d8a">topo →</text>

  <rect x="215" y="100" width="120" height="60" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2.5" rx="4"/>
  <line x1="295" y1="100" x2="295" y2="160" stroke="#2c5d8a" stroke-width="2"/>
  <text x="255" y="138" text-anchor="middle" font-size="22" fill="#222"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">NOVO_TOPO</text>
  <text x="315" y="138" text-anchor="middle" font-size="14" fill="#888">∅</text>
  <text x="355" y="138" font-size="13" fill="#888" font-style="italic">(NULL — fundo)</text>

  <line x1="100" y1="220" x2="600" y2="220" stroke="#cfd6dd" stroke-width="1"/>
  <text x="350" y="250" text-anchor="middle" font-size="13" fill="#5a7a9a" font-style="italic">
    no antigo liberado · topo "afunda" para o de baixo
  </text>
</svg>
