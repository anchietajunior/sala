<!--
    Slide do Eddy — copiar para a posição apropriada dentro de <div class="slides">.
    Regras: aparição em <section> dedicada, fala começa com "Turma,", até 3-4 frases,
    cita fonte com <cite> quando aplicável. NUNCA dá a resposta dos exercícios.

    Variantes:
      <div class="eddy-card">             — padrão
      <div class="eddy-card eddy-card--longo">  — para falas mais extensas

    Ver references/eddy-quando-usar.md para escolha de conteúdo e posicionamento.
-->

<section class="eddy-slide">
    <div class="eddy-card">
        <div class="eddy-avatar">
            <img src="../assets/bot/eddy.svg" alt="Eddy">
        </div>
        <div class="eddy-balao">
            <strong class="eddy-nome">Eddy</strong>
            <p class="eddy-fala">
                Turma, <conteúdo da fala — citação, curiosidade, aplicação ou dica>.
                <cite>Fonte (opcional)</cite>
            </p>
        </div>
    </div>
</section>
