  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    <rect x="425" y="235" width="55" height="50" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="2" rx="3" stroke-dasharray="5,3"/>
    <text x="452" y="266" text-anchor="middle" font-size="18" fill="#888">0</text>
    <rect x="485" y="235" width="55" height="50" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="2" rx="3" stroke-dasharray="5,3"/>
