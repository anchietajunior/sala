    <rect x="425" y="155" width="55" height="50" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="2" rx="3" stroke-dasharray="5,3"/>
    <text x="452" y="186" text-anchor="middle" font-size="18" fill="#888">9</text>
    <rect x="485" y="155" width="55" height="50" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="2" rx="3" stroke-dasharray="5,3"/>
    <text x="512" y="186" text-anchor="middle" font-size="18" fill="#888">0</text>
    <rect x="545" y="155" width="55" height="50" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="2" rx="3" stroke-dasharray="5,3"/>
    <text x="572" y="186" text-anchor="middle" font-size="18" fill="#888">0</text>
    <rect x="605" y="155" width="55" height="50" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="2" rx="3" stroke-dasharray="5,3"/>
    <text x="632" y="186" text-anchor="middle" font-size="18" fill="#888">0</text>
