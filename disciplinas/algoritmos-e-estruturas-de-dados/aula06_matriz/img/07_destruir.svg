  <circle cx="335" cy="100" r="3.5" fill="#2c5d8a"/>

  <text x="225" y="178" text-anchor="end" font-size="12" fill="#888">[1]</text>
  <rect x="235" y="155" width="100" height="50" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <text x="275" y="186" text-anchor="middle" font-size="14" fill="#222"
