<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <text x="360" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#2c5d8a">
    1a camada: o ponteiro M-&gt;dados e o vetor externo
  </text>

  <!-- ===== M->dados ===== -->
  <text x="110" y="118" text-anchor="middle" font-size="14" fill="#5a7a9a" font-style="italic">
    M-&gt;dados
  </text>
  <rect x="40" y="130" width="140" height="60" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2.5" rx="4"/>
  <text x="110" y="167" text-anchor="middle" font-size="14" fill="#222"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    endereco do vetor
  </text>
  <circle cx="180" cy="160" r="4" fill="#2c5d8a"/>

  <!-- Seta de M->dados para o vetor externo -->
  <path d="M 180 160 L 297 160" fill="none" stroke="#2c5d8a" stroke-width="2.5"/>
  <polygon points="290,155 303,160 290,165" fill="#2c5d8a"/>

  <!-- ===== Vetor externo ===== -->
  <text x="430" y="80" text-anchor="middle" font-size="14" fill="#5a7a9a" font-style="italic">
    Vetor externo — um ponteiro por linha
  </text>

  <!-- slot 0 -->
  <text x="295" y="118" text-anchor="end" font-size="13" fill="#888">[0]</text>
  <rect x="305" y="95" width="220" height="50" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <text x="415" y="126" text-anchor="middle" font-size="15" fill="#222">aponta para linha 0</text>

  <!-- slot 1 -->
  <text x="295" y="178" text-anchor="end" font-size="13" fill="#888">[1]</text>
  <rect x="305" y="155" width="220" height="50" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <text x="415" y="186" text-anchor="middle" font-size="15" fill="#222">aponta para linha 1</text>

  <!-- slot 2 -->
  <text x="295" y="238" text-anchor="end" font-size="13" fill="#888">[2]</text>
  <rect x="305" y="215" width="220" height="50" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2" rx="4"/>
  <text x="415" y="246" text-anchor="middle" font-size="15" fill="#222">aponta para linha 2</text>

  <!-- Nota -->
  <line x1="80" y1="285" x2="640" y2="285" stroke="#cfd6dd" stroke-width="1"/>
  <text x="360" y="308" text-anchor="middle" font-size="13" fill="#5a7a9a" font-style="italic">
    Por enquanto: so o esqueleto. As linhas reais entram no proximo slide.
  </text>
</svg>
