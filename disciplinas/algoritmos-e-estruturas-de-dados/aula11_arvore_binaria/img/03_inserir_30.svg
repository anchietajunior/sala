<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <text x="350" y="40" text-anchor="middle" font-size="18" font-weight="600" fill="#2c5d8a">
    Passo 3 — inserir(30)
  </text>

  <!-- raiz -> 50 -->
  <text x="290" y="110" text-anchor="end" font-size="16" font-weight="600" fill="#2c5d8a">raiz →</text>

  <!-- Aresta 50 -> 30 (desenhada antes dos círculos para ficar por baixo) -->
  <line x1="350" y1="105" x2="240" y2="220" stroke="#2c5d8a" stroke-width="2"/>

  <!-- Nó 50 -->
  <circle cx="350" cy="105" r="28" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2"/>
  <text x="350" y="112" text-anchor="middle" font-size="20" fill="#222"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">50</text>

  <!-- perna direita NULL -->
  <line x1="365" y1="128" x2="385" y2="170" stroke="#cfd6dd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="385" y="190" text-anchor="middle" font-size="14" fill="#888"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">∅</text>

  <!-- Nó 30 (novo, em destaque) -->
  <circle cx="240" cy="220" r="28" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2.5"/>
  <text x="240" y="227" text-anchor="middle" font-size="20" fill="#222"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">30</text>

  <!-- pernas NULL do 30 -->
  <line x1="225" y1="243" x2="205" y2="285" stroke="#cfd6dd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="255" y1="243" x2="275" y2="285" stroke="#cfd6dd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="205" y="305" text-anchor="middle" font-size="14" fill="#888"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">∅</text>
  <text x="275" y="305" text-anchor="middle" font-size="14" fill="#888"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">∅</text>

  <!-- separador + nota -->
  <line x1="100" y1="320" x2="600" y2="320" stroke="#cfd6dd" stroke-width="1"/>
  <text x="350" y="345" text-anchor="middle" font-size="13" fill="#5a7a9a" font-style="italic">
    30 &lt; 50 → desce à esquerda · 50→esq era NULL · 30 vira filho esquerdo
  </text>
</svg>
