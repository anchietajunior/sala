<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <text x="350" y="40" text-anchor="middle" font-size="18" font-weight="600" fill="#2c5d8a">
    Passo 1 — arvore_criar()
  </text>

  <!-- ponteiro raiz apontando para NULL -->
  <text x="290" y="120" text-anchor="end" font-size="16" font-weight="600" fill="#2c5d8a">raiz →</text>
  <text x="330" y="125" font-size="32" fill="#888"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">∅</text>
  <text x="370" y="120" font-size="14" fill="#888" font-style="italic">(NULL)</text>

  <!-- separador + nota -->
  <line x1="100" y1="170" x2="600" y2="170" stroke="#cfd6dd" stroke-width="1"/>
  <text x="350" y="195" text-anchor="middle" font-size="13" fill="#5a7a9a" font-style="italic">
    a árvore vazia tem raiz = NULL · nenhum nó alocado
  </text>
</svg>
