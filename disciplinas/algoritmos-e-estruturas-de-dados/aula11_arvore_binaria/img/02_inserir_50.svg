<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <text x="350" y="40" text-anchor="middle" font-size="18" font-weight="600" fill="#2c5d8a">
    Passo 2 — inserir(50)
  </text>

  <!-- raiz -> nó 50 -->
  <text x="290" y="110" text-anchor="end" font-size="16" font-weight="600" fill="#2c5d8a">raiz →</text>

  <!-- Nó 50 (raiz nova, em destaque) -->
  <circle cx="350" cy="105" r="28" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2.5"/>
  <text x="350" y="112" text-anchor="middle" font-size="20" fill="#222"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">50</text>

  <!-- pernas indicando esq e dir NULL -->
  <line x1="335" y1="128" x2="315" y2="170" stroke="#cfd6dd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="365" y1="128" x2="385" y2="170" stroke="#cfd6dd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="315" y="190" text-anchor="middle" font-size="16" fill="#888"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">∅</text>
  <text x="385" y="190" text-anchor="middle" font-size="16" fill="#888"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">∅</text>
  <text x="295" y="208" text-anchor="end" font-size="11" fill="#888" font-style="italic">esq</text>
  <text x="405" y="208" text-anchor="start" font-size="11" fill="#888" font-style="italic">dir</text>

  <!-- separador + nota -->
  <line x1="100" y1="230" x2="600" y2="230" stroke="#cfd6dd" stroke-width="1"/>
  <text x="350" y="255" text-anchor="middle" font-size="13" fill="#5a7a9a" font-style="italic">
    a árvore estava vazia · o novo nó vira a raiz · esq e dir nascem NULL
  </text>
</svg>
