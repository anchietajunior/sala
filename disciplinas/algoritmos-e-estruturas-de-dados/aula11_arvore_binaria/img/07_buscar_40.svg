<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <text x="350" y="40" text-anchor="middle" font-size="18" font-weight="600" fill="#2c5d8a">
    Passo 7 — buscar(40)
  </text>

  <!-- raiz -> 50 -->
  <text x="290" y="100" text-anchor="end" font-size="16" font-weight="600" fill="#2c5d8a">raiz →</text>

  <!-- Arestas: o caminho 50→30→40 fica destacado (stroke 3.5); as outras finas (1.5, cinza) -->
  <line x1="350" y1="95" x2="220" y2="210" stroke="#2c5d8a" stroke-width="3.5"/>
  <line x1="350" y1="95" x2="480" y2="210" stroke="#cfd6dd" stroke-width="1.5"/>
  <line x1="220" y1="210" x2="140" y2="325" stroke="#cfd6dd" stroke-width="1.5"/>
  <line x1="220" y1="210" x2="300" y2="325" stroke="#2c5d8a" stroke-width="3.5"/>

  <!-- rótulos de comparação ao longo do caminho -->
  <text x="305" y="155" font-size="12" fill="#2c5d8a" font-style="italic" font-weight="600">40 &lt; 50</text>
  <text x="270" y="285" font-size="12" fill="#2c5d8a" font-style="italic" font-weight="600">40 &gt; 30</text>

  <!-- Nó 50 (visitado) -->
  <circle cx="350" cy="95" r="28" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2.5"/>
  <text x="350" y="102" text-anchor="middle" font-size="20" fill="#222"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">50</text>

  <!-- Nó 30 (visitado) -->
  <circle cx="220" cy="210" r="28" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2.5"/>
  <text x="220" y="217" text-anchor="middle" font-size="20" fill="#222"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">30</text>

  <!-- Nó 70 (não visitado — apagado) -->
  <circle cx="480" cy="210" r="28" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="1.5"/>
  <text x="480" y="217" text-anchor="middle" font-size="20" fill="#888"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">70</text>

  <!-- Nó 20 (não visitado — apagado) -->
  <circle cx="140" cy="325" r="28" fill="#f7f9fc" stroke="#cfd6dd" stroke-width="1.5"/>
  <text x="140" y="332" text-anchor="middle" font-size="20" fill="#888"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">20</text>

  <!-- Nó 40 (encontrado — destaque forte, anel duplo) -->
  <circle cx="300" cy="325" r="34" fill="none" stroke="#2c5d8a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="300" cy="325" r="28" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="3.5"/>
  <text x="300" y="332" text-anchor="middle" font-size="20" fill="#222"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">40</text>
  <text x="350" y="332" font-size="14" fill="#2c5d8a" font-weight="600">✓ encontrado</text>

  <!-- separador + nota -->
  <line x1="100" y1="420" x2="600" y2="420" stroke="#cfd6dd" stroke-width="1"/>
  <text x="350" y="445" text-anchor="middle" font-size="13" fill="#5a7a9a" font-style="italic">
    cada comparação descarta uma subárvore inteira · 2 passos para 5 nós · O(log n)
  </text>
</svg>
