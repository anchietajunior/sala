<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>

  <!-- Objeto -->
  <rect x="230" y="40" width="360" height="300" rx="12" fill="#ffffff" stroke="#2e6da4" stroke-width="2.5"/>
  <text x="410" y="70" font-size="16" font-weight="bold" fill="#2e6da4" text-anchor="middle">objeto Book</text>

  <!-- Nucleo interno -->
  <rect x="272" y="92" width="276" height="120" rx="8" fill="#f4f2ee" stroke="#cfcabd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="410" y="116" font-size="13" fill="#777" text-anchor="middle">estado interno — como é guardado</text>
  <text x="410" y="148" font-size="16" fill="#222" font-family="Consolas, monospace" text-anchor="middle">_pages = 464</text>
  <text x="410" y="176" font-size="16" fill="#222" font-family="Consolas, monospace" text-anchor="middle">current_page = 120</text>
  <text x="410" y="200" font-size="12" fill="#999" text-anchor="middle">pode mudar sem avisar ninguém</text>

  <!-- Interface publica -->
  <text x="410" y="248" font-size="13" fill="#2e6da4" text-anchor="middle">interface pública — o que se pode usar</text>
  <rect x="256" y="262" width="140" height="34" rx="17" fill="#2e6da4"/>
  <text x="326" y="284" font-size="13" fill="#ffffff" font-family="Consolas, monospace" text-anchor="middle">book.pages</text>
  <rect x="410" y="262" width="164" height="34" rx="17" fill="#2e6da4"/>
  <text x="492" y="284" font-size="12" fill="#ffffff" font-family="Consolas, monospace" text-anchor="middle">progress_percentage</text>
  <text x="410" y="322" font-size="12" fill="#999" text-anchor="middle">contrato estável: quem usa depende só disto</text>

  <!-- Setas externas -->
  <line x1="120" y1="279" x2="248" y2="279" stroke="#b8860b" stroke-width="2.5"/>
  <polygon points="248,279 236,273 236,285" fill="#b8860b"/>
  <text x="30" y="274" font-size="14" fill="#222">o resto do</text>
  <text x="30" y="292" font-size="14" fill="#222">programa</text>

  <line x1="700" y1="152" x2="600" y2="152" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 5"/>
  <circle cx="650" cy="152" r="15" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="643" y1="145" x2="657" y2="159" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="657" y1="145" x2="643" y2="159" stroke="#c0392b" stroke-width="2.5"/>
  <text x="712" y="148" font-size="13" fill="#c0392b">ninguém</text>
  <text x="712" y="166" font-size="13" fill="#c0392b">mexe aqui</text>

  <text x="410" y="376" font-size="14" fill="#555" text-anchor="middle">Trocar a implementação interna não quebra quem usa a interface.</text>
</svg>
