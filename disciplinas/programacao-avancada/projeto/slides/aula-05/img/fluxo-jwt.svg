<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" style="width:100%;max-width:760px">
  <defs>
    <marker id="setaJ" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#444"/>
    </marker>
  </defs>

  <!-- ato 1: login -->
  <text x="30" y="32" font-size="14" font-weight="bold" fill="#555">1. Login — credenciais viram token</text>

  <rect x="30" y="48" width="150" height="64" rx="10" fill="#f4f2ee" stroke="#888" stroke-width="2"/>
  <text x="105" y="74" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#555">POST /login</text>
  <text x="105" y="96" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#555">{email, password}</text>

  <rect x="255" y="48" width="220" height="64" rx="10" fill="#eef4fa" stroke="#2e6da4" stroke-width="2"/>
  <text x="365" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6da4">verify_password</text>
  <text x="365" y="96" text-anchor="middle" font-size="12" fill="#2e6da4">hash digitado × hash guardado</text>

  <rect x="550" y="48" width="220" height="64" rx="10" fill="#eef7ee" stroke="#5a9a5a" stroke-width="2"/>
  <text x="660" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a7a3a">create_access_token</text>
  <text x="660" y="96" text-anchor="middle" font-size="12" font-family="monospace" fill="#3a7a3a">{sub, exp} + assinatura</text>

  <line x1="185" y1="80" x2="250" y2="80" stroke="#444" stroke-width="2" marker-end="url(#setaJ)"/>
  <line x1="480" y1="80" x2="545" y2="80" stroke="#444" stroke-width="2" marker-end="url(#setaJ)"/>

  <text x="400" y="146" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#3a7a3a">← 200 {"access_token": "eyJ...", "token_type": "bearer"}</text>

  <!-- ato 2: requisicao autenticada -->
  <text x="30" y="192" font-size="14" font-weight="bold" fill="#555">2. Cada requisição — o token prova a identidade</text>

  <rect x="30" y="208" width="180" height="76" rx="10" fill="#f4f2ee" stroke="#888" stroke-width="2"/>
  <text x="120" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">GET /api/books</text>
  <text x="120" y="252" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#555">Authorization:</text>
  <text x="120" y="268" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#555">Bearer eyJ...</text>

  <rect x="285" y="208" width="220" height="76" rx="10" fill="#eef4fa" stroke="#2e6da4" stroke-width="2"/>
  <text x="395" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6da4">get_current_user</text>
  <text x="395" y="252" text-anchor="middle" font-size="11.5" fill="#2e6da4">verifica assinatura e exp,</text>
  <text x="395" y="270" text-anchor="middle" font-size="11.5" fill="#2e6da4">busca o User do sub</text>

  <rect x="580" y="208" width="190" height="76" rx="10" fill="#fdf6e3" stroke="#b8860b" stroke-width="2"/>
  <text x="675" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6508">a rota</text>
  <text x="675" y="252" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#8a6508">WHERE user_id =</text>
  <text x="675" y="270" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#8a6508">current_user.id</text>

  <line x1="215" y1="246" x2="280" y2="246" stroke="#444" stroke-width="2" marker-end="url(#setaJ)"/>
  <line x1="510" y1="246" x2="575" y2="246" stroke="#444" stroke-width="2" marker-end="url(#setaJ)"/>

  <text x="395" y="318" text-anchor="middle" font-size="12.5" fill="#c0392b" font-weight="bold">token ausente, inválido ou vencido → 401 (a rota nem executa)</text>
  <text x="400" y="346" text-anchor="middle" font-size="13" fill="#333">O servidor não guarda sessão: <tspan font-weight="bold">verificar a assinatura</tspan> é tudo de que ele precisa.</text>
</svg>
