<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" style="width:100%;max-width:740px">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#444"/>
    </marker>
  </defs>

  <text x="30" y="30" font-size="16" font-weight="bold" fill="#8a6508" font-family="monospace">tabela book — lado N</text>
  <text x="490" y="30" font-size="16" font-weight="bold" fill="#8a6508" font-family="monospace">tabela user — lado 1</text>

  <!-- callout FK -->
  <text x="355" y="62" text-anchor="middle" font-size="13" fill="#2e6da4" font-weight="bold">chave estrangeira: guarda um valor de user.id</text>
  <line x1="355" y1="68" x2="355" y2="92" stroke="#444" stroke-width="1.5" marker-end="url(#seta)"/>

  <!-- cabeçalho book -->
  <g font-family="monospace" font-size="14">
    <rect x="30" y="95" width="45" height="36" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/>
    <rect x="75" y="95" width="180" height="36" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/>
    <rect x="255" y="95" width="60" height="36" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/>
    <rect x="315" y="95" width="80" height="36" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/>
    <text x="52" y="118" text-anchor="middle" font-weight="bold" fill="#8a6508">id</text>
    <text x="165" y="118" text-anchor="middle" font-weight="bold" fill="#8a6508">title</text>
    <text x="285" y="118" text-anchor="middle" font-weight="bold" fill="#8a6508">pages</text>
    <text x="355" y="118" text-anchor="middle" font-weight="bold" fill="#8a6508">user_id</text>
  </g>

  <!-- linhas book -->
  <g font-family="monospace" font-size="12.5">
    <rect x="30" y="131" width="45" height="34" fill="#fff" stroke="#ccc"/>
    <rect x="75" y="131" width="180" height="34" fill="#fff" stroke="#ccc"/>
    <rect x="255" y="131" width="60" height="34" fill="#fff" stroke="#ccc"/>
    <rect x="315" y="131" width="80" height="34" fill="#fff" stroke="#ccc"/>
    <text x="52" y="152" text-anchor="middle" fill="#333">1</text>
    <text x="165" y="152" text-anchor="middle" fill="#333">Dom Casmurro</text>
    <text x="285" y="152" text-anchor="middle" fill="#333">208</text>
    <text x="355" y="152" text-anchor="middle" fill="#333" font-weight="bold">1</text>

    <rect x="30" y="165" width="45" height="34" fill="#fff" stroke="#ccc"/>
    <rect x="75" y="165" width="180" height="34" fill="#fff" stroke="#ccc"/>
    <rect x="255" y="165" width="60" height="34" fill="#fff" stroke="#ccc"/>
    <rect x="315" y="165" width="80" height="34" fill="#fff" stroke="#ccc"/>
    <text x="52" y="186" text-anchor="middle" fill="#333">2</text>
    <text x="165" y="186" text-anchor="middle" fill="#333">Memórias Póstumas</text>
    <text x="285" y="186" text-anchor="middle" fill="#333">368</text>
    <text x="355" y="186" text-anchor="middle" fill="#333" font-weight="bold">1</text>

    <rect x="30" y="199" width="45" height="34" fill="#fff" stroke="#ccc"/>
    <rect x="75" y="199" width="180" height="34" fill="#fff" stroke="#ccc"/>
    <rect x="255" y="199" width="60" height="34" fill="#fff" stroke="#ccc"/>
    <rect x="315" y="199" width="80" height="34" fill="#fff" stroke="#ccc"/>
    <text x="52" y="220" text-anchor="middle" fill="#333">3</text>
    <text x="165" y="220" text-anchor="middle" fill="#333">A Hora da Estrela</text>
    <text x="285" y="220" text-anchor="middle" fill="#333">96</text>
    <text x="355" y="220" text-anchor="middle" fill="#333" font-weight="bold">2</text>
  </g>

  <!-- cabeçalho user -->
  <g font-family="monospace" font-size="14">
    <rect x="490" y="95" width="50" height="36" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/>
    <rect x="540" y="95" width="180" height="36" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/>
    <text x="515" y="118" text-anchor="middle" font-weight="bold" fill="#8a6508">id</text>
    <text x="630" y="118" text-anchor="middle" font-weight="bold" fill="#8a6508">name</text>
  </g>

  <!-- linhas user -->
  <g font-family="monospace" font-size="12.5">
    <rect x="490" y="131" width="50" height="34" fill="#fff" stroke="#ccc"/>
    <rect x="540" y="131" width="180" height="34" fill="#fff" stroke="#ccc"/>
    <text x="515" y="152" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <text x="630" y="152" text-anchor="middle" fill="#333">Machado de Assis</text>

    <rect x="490" y="165" width="50" height="34" fill="#fff" stroke="#ccc"/>
    <rect x="540" y="165" width="180" height="34" fill="#fff" stroke="#ccc"/>
    <text x="515" y="186" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <text x="630" y="186" text-anchor="middle" fill="#333">Clarice Lispector</text>
  </g>

  <!-- setas user_id -> user.id -->
  <line x1="395" y1="148" x2="487" y2="148" stroke="#2e6da4" stroke-width="1.8" marker-end="url(#seta)"/>
  <line x1="395" y1="182" x2="450" y2="182" stroke="#2e6da4" stroke-width="1.8"/>
  <line x1="450" y1="182" x2="450" y2="152" stroke="#2e6da4" stroke-width="1.8"/>
  <line x1="450" y1="152" x2="487" y2="150" stroke="#2e6da4" stroke-width="1.8" marker-end="url(#seta)"/>
  <line x1="395" y1="216" x2="470" y2="216" stroke="#2e6da4" stroke-width="1.8"/>
  <line x1="470" y1="216" x2="470" y2="186" stroke="#2e6da4" stroke-width="1.8"/>
  <line x1="470" y1="186" x2="487" y2="184" stroke="#2e6da4" stroke-width="1.8" marker-end="url(#seta)"/>

  <!-- legenda cardinalidade -->
  <text x="390" y="272" text-anchor="middle" font-size="14" fill="#2e6da4" font-weight="bold">um User tem muitos Books · cada Book pertence a exatamente um User</text>
  <text x="390" y="300" text-anchor="middle" font-size="13" fill="#777">A chave estrangeira mora sempre no lado N: o filho aponta para o pai.</text>
  <text x="390" y="322" text-anchor="middle" font-size="13" fill="#777">O banco recusa user_id que não exista em user.id — integridade referencial.</text>
</svg>
