<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" style="width:100%;max-width:760px">
  <defs>
    <marker id="setaC" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>

  <!-- ordem de construção -->
  <path d="M 95 330 L 95 50" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#setaC)"/>
  <text x="70" y="190" text-anchor="middle" font-size="13" fill="#555" transform="rotate(-90 70 190)">ordem de construção</text>

  <!-- 3. frontend -->
  <rect x="130" y="40" width="560" height="80" rx="8" fill="#eef4fa" stroke="#2e6da4" stroke-width="1.8"/>
  <circle cx="165" cy="80" r="17" fill="#2e6da4"/>
  <text x="165" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">3</text>
  <text x="200" y="72" font-size="15" font-weight="bold" fill="#2e6da4">Frontend - a interface mostra o que o papel permite</text>
  <text x="200" y="98" font-size="12.5" font-family="monospace" fill="#333">link e página /admin  ·  AdminDashboardPage</text>

  <!-- 2. backend -->
  <rect x="130" y="145" width="560" height="80" rx="8" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.8"/>
  <circle cx="165" cy="185" r="17" fill="#b8860b"/>
  <text x="165" y="191" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">2</text>
  <text x="200" y="177" font-size="15" font-weight="bold" fill="#8a6508">Backend - a API lê o papel e decide o acesso</text>
  <text x="200" y="203" font-size="12.5" font-family="monospace" fill="#333">can_access  ·  require_admin  ·  401 / 403 / 404</text>

  <!-- 1. banco -->
  <rect x="130" y="250" width="560" height="80" rx="8" fill="#eef7ee" stroke="#3c8d3c" stroke-width="1.8"/>
  <circle cx="165" cy="290" r="17" fill="#3c8d3c"/>
  <text x="165" y="296" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">1</text>
  <text x="200" y="282" font-size="15" font-weight="bold" fill="#2f6f2f">Banco de dados - o papel é um dado</text>
  <text x="200" y="308" font-size="12.5" font-family="monospace" fill="#333">users.role ENUM('admin','user') DEFAULT 'user'</text>

  <!-- rodapé -->
  <text x="410" y="365" text-anchor="middle" font-size="13" fill="#333">Cada camada depende da que está abaixo: sem o dado não há decisão; sem a decisão, não há o que mostrar.</text>
</svg>
