<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" style="width:100%;max-width:760px">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>

  <text x="200" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Caixa preta</text>
  <text x="600" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Caixa branca</text>

  <!-- caixa preta -->
  <text x="200" y="62" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#333">POST /api/books {"name": "&#160;&#160;&#160;"}</text>
  <path d="M 200 70 L 200 98" fill="none" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>
  <rect x="110" y="102" width="180" height="90" rx="8" fill="#2b2b2b"/>
  <text x="200" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">API</text>
  <text x="200" y="168" text-anchor="middle" font-size="11.5" fill="#bbb">o teste não vê o código</text>
  <path d="M 200 196 L 200 224" fill="none" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>
  <text x="200" y="244" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">422</text>
  <text x="200" y="280" text-anchor="middle" font-size="12.5" fill="#333">os casos saem da especificação:</text>
  <text x="200" y="300" text-anchor="middle" font-size="12.5" fill="#333">entradas e saídas esperadas</text>
  <text x="200" y="324" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#8a6508">test_books_api.py</text>

  <!-- caixa branca -->
  <rect x="440" y="52" width="320" height="200" rx="8" fill="#fff" stroke="#555" stroke-width="1.8"/>
  <text x="600" y="80" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#333">return self.is_admin or</text>
  <text x="600" y="98" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#333">book.user_id == self.id</text>
  <rect x="460" y="114" width="280" height="36" rx="6" fill="#eef7ee" stroke="#3c8d3c" stroke-width="1.4"/>
  <text x="600" y="137" text-anchor="middle" font-size="12" fill="#333">1. é Admin → True</text>
  <rect x="460" y="156" width="280" height="36" rx="6" fill="#eef7ee" stroke="#3c8d3c" stroke-width="1.4"/>
  <text x="600" y="179" text-anchor="middle" font-size="12" fill="#333">2. não é Admin, é o dono → True</text>
  <rect x="460" y="198" width="280" height="36" rx="6" fill="#fdecea" stroke="#b03a2e" stroke-width="1.4"/>
  <text x="600" y="221" text-anchor="middle" font-size="12" fill="#333">3. nenhum dos dois → False</text>
  <text x="600" y="280" text-anchor="middle" font-size="12.5" fill="#333">os casos saem do código:</text>
  <text x="600" y="300" text-anchor="middle" font-size="12.5" fill="#333">um teste para cada caminho</text>
  <text x="600" y="324" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#8a6508">test_models.py</text>

  <text x="400" y="352" text-anchor="middle" font-size="12" fill="#999">MYERS, G. - The Art of Software Testing, 1979</text>
</svg>
