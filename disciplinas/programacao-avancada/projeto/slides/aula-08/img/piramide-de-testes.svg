<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" style="width:100%;max-width:760px">
  <!-- aceitação -->
  <polygon points="340,40 460,40 550,140 250,140" fill="#eef4fa" stroke="#2e6da4" stroke-width="1.8"/>
  <text x="400" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6da4">Aceitação</text>
  <text x="400" y="98" text-anchor="middle" font-size="11.5" fill="#333">ponta a ponta · Playwright</text>
  <text x="400" y="118" text-anchor="middle" font-size="11.5" fill="#333">2 testes · ~2 s</text>

  <!-- integração -->
  <polygon points="240,150 560,150 650,250 150,250" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.8"/>
  <text x="400" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6508">Integração</text>
  <text x="400" y="206" text-anchor="middle" font-size="11.5" fill="#333">rotas + schemas + regras + banco · pytest + TestClient</text>
  <text x="400" y="226" text-anchor="middle" font-size="11.5" fill="#333">12 testes · ~5 s</text>

  <!-- unidade -->
  <polygon points="140,260 660,260 750,360 50,360" fill="#eef7ee" stroke="#3c8d3c" stroke-width="1.8"/>
  <text x="400" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f6f2f">Unidade</text>
  <text x="400" y="316" text-anchor="middle" font-size="11.5" fill="#333">um model, um componente, um service · pytest e Vitest</text>
  <text x="400" y="336" text-anchor="middle" font-size="11.5" fill="#333">7 + 5 testes · menos de 1 s</text>

  <!-- leitura -->
  <text x="400" y="390" text-anchor="middle" font-size="12.5" fill="#333">Para cima: mais próximos do uso real, mais lentos e mais frágeis.</text>
  <text x="400" y="410" text-anchor="middle" font-size="12.5" fill="#333">Para baixo: mais rápidos, mais baratos, e apontam onde está o defeito.</text>
</svg>
