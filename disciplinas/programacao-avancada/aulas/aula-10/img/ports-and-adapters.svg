<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>

  <text x="115" y="60" text-anchor="middle" font-size="12" fill="#666">quem aciona a aplicação</text>
  <text x="685" y="60" text-anchor="middle" font-size="12" fill="#666">o que a aplicação aciona</text>

  <!-- a aplicação: o hexágono -->
  <polygon points="330,70 470,70 545,180 470,290 330,290 255,180" fill="#eef4fa" stroke="#2e6da4" stroke-width="2"/>
  <text x="400" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Aplicação</text>
  <text x="400" y="174" text-anchor="middle" font-size="12.5" fill="#333">regras do domínio</text>
  <text x="400" y="191" text-anchor="middle" font-size="12.5" fill="#333">e casos de uso</text>
  <text x="400" y="218" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2e6da4">Book · User · can_access</text>

  <!-- adaptadores de entrada -->
  <rect x="20" y="95" width="190" height="60" rx="8" fill="#fff" stroke="#555" stroke-width="1.8"/>
  <text x="115" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Rota FastAPI</text>
  <text x="115" y="141" text-anchor="middle" font-size="12" fill="#555">adaptador de entrada</text>

  <rect x="20" y="205" width="190" height="60" rx="8" fill="#fff" stroke="#555" stroke-width="1.8"/>
  <text x="115" y="231" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Teste automatizado</text>
  <text x="115" y="251" text-anchor="middle" font-size="12" fill="#555">adaptador de entrada</text>

  <!-- adaptadores de saída -->
  <rect x="590" y="95" width="190" height="60" rx="8" fill="#fff" stroke="#555" stroke-width="1.8"/>
  <text x="685" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">SQLAlchemy + MySQL</text>
  <text x="685" y="141" text-anchor="middle" font-size="12" fill="#555">adaptador de saída</text>

  <rect x="590" y="205" width="190" height="60" rx="8" fill="#fff" stroke="#555" stroke-width="1.8"/>
  <text x="685" y="231" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">httpx2 + Gemini</text>
  <text x="685" y="251" text-anchor="middle" font-size="12" fill="#555">adaptador de saída</text>

  <!-- dependências: todas apontam para a aplicação -->
  <path d="M 212 125 L 282 125" fill="none" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>
  <path d="M 212 235 L 282 235" fill="none" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>
  <path d="M 588 125 L 518 125" fill="none" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>
  <path d="M 588 235 L 518 235" fill="none" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>

  <!-- portas: os pontos da borda em que os adaptadores se ligam -->
  <circle cx="292" cy="125" r="8" fill="#2e6da4"/>
  <circle cx="292" cy="235" r="8" fill="#2e6da4"/>
  <circle cx="508" cy="125" r="8" fill="#2e6da4"/>
  <circle cx="508" cy="235" r="8" fill="#2e6da4"/>
  <text x="222" y="178" text-anchor="middle" font-size="11.5" fill="#2e6da4">porta de</text>
  <text x="222" y="192" text-anchor="middle" font-size="11.5" fill="#2e6da4">entrada</text>
  <text x="578" y="178" text-anchor="middle" font-size="11.5" fill="#2e6da4">portas</text>
  <text x="578" y="192" text-anchor="middle" font-size="11.5" fill="#2e6da4">de saída</text>

  <text x="400" y="322" text-anchor="middle" font-size="13" fill="#222">As setas indicam dependência de código: todas apontam para a aplicação.</text>
  <text x="400" y="342" text-anchor="middle" font-size="13" fill="#222">A aplicação define as portas e não importa FastAPI, SQLAlchemy nem httpx2.</text>
  <text x="400" y="378" text-anchor="middle" font-size="12" fill="#999">COCKBURN, A. - Hexagonal Architecture (Ports and Adapters), 2005</text>
</svg>
