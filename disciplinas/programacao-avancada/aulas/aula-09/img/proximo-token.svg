<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>

  <!-- texto até agora -->
  <text x="125" y="40" text-anchor="middle" font-size="12" fill="#666">texto até agora</text>
  <rect x="20" y="60" width="210" height="56" rx="8" fill="#fff" stroke="#555" stroke-width="1.8"/>
  <text x="125" y="93" text-anchor="middle" font-size="13.5" fill="#222">Dom Casmurro é narrado por</text>

  <path d="M 232 88 L 276 88" fill="none" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>

  <!-- o modelo -->
  <rect x="280" y="60" width="140" height="56" rx="8" fill="#2b2b2b"/>
  <text x="350" y="85" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#fff">modelo de</text>
  <text x="350" y="103" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#fff">linguagem</text>

  <path d="M 422 88 L 466 88" fill="none" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>

  <!-- distribuição de probabilidades da próxima palavra -->
  <text x="625" y="40" text-anchor="middle" font-size="12" fill="#666">probabilidade da próxima palavra</text>
  <text x="478" y="66" font-size="13" fill="#222">Bentinho</text>
  <rect x="560" y="54" width="124" height="16" rx="3" fill="#2e6da4"/>
  <text x="692" y="67" font-size="12" fill="#333">0,62</text>
  <text x="478" y="92" font-size="13" fill="#222">Dom</text>
  <rect x="560" y="80" width="42" height="16" rx="3" fill="#9dbbd9"/>
  <text x="610" y="93" font-size="12" fill="#333">0,21</text>
  <text x="478" y="118" font-size="13" fill="#222">um</text>
  <rect x="560" y="106" width="18" height="16" rx="3" fill="#9dbbd9"/>
  <text x="586" y="119" font-size="12" fill="#333">0,09</text>
  <text x="478" y="144" font-size="13" fill="#222">Capitu</text>
  <rect x="560" y="132" width="6" height="16" rx="3" fill="#9dbbd9"/>
  <text x="574" y="145" font-size="12" fill="#333">0,03</text>
  <text x="478" y="168" font-size="13" fill="#999">…</text>

  <!-- sorteio e repetição -->
  <path d="M 620 178 L 620 210 L 340 210 L 340 232" fill="none" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>
  <text x="480" y="202" text-anchor="middle" font-size="12" fill="#333">sorteio segundo as probabilidades</text>
  <rect x="160" y="236" width="360" height="44" rx="8" fill="#eef7ee" stroke="#3c8d3c" stroke-width="1.4"/>
  <text x="340" y="263" text-anchor="middle" font-size="13.5" fill="#222">Dom Casmurro é narrado por <tspan font-weight="bold">Bentinho</tspan></text>
  <text x="540" y="263" font-size="12" fill="#333">→ e o ciclo se repete</text>

  <text x="400" y="304" text-anchor="middle" font-size="12" fill="#666">Probabilidades ilustrativas; na prática, o modelo escolhe tokens, que podem ser pedaços de palavra.</text>
  <text x="400" y="324" text-anchor="middle" font-size="12" fill="#999">JURAFSKY, D.; MARTIN, J. H. - Speech and Language Processing, 3ª ed.</text>
</svg>
