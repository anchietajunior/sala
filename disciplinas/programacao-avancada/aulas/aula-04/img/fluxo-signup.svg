<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" style="width:100%;max-width:760px">
  <defs>
    <marker id="setaF" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#444"/>
    </marker>
  </defs>

  <!-- fronteiras -->
  <line x1="205" y1="30" x2="205" y2="255" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="205" y="20" text-anchor="middle" font-size="12.5" fill="#777">fronteira JSON ↔ objeto (Pydantic)</text>
  <line x1="595" y1="30" x2="595" y2="255" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="595" y="20" text-anchor="middle" font-size="12.5" fill="#777">fronteira objeto ↔ linha (SQLAlchemy)</text>

  <!-- ida -->
  <rect x="20" y="60" width="160" height="70" rx="10" fill="#f4f2ee" stroke="#888" stroke-width="2"/>
  <text x="100" y="87" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">POST /signup</text>
  <g font-family="monospace" font-size="11.5" fill="#555">
    <text x="100" y="106" text-anchor="middle">{name, email,</text>
    <text x="100" y="120" text-anchor="middle">password}</text>
  </g>

  <rect x="230" y="60" width="150" height="70" rx="10" fill="#eef4fa" stroke="#2e6da4" stroke-width="2"/>
  <text x="305" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6da4">UserCreate</text>
  <text x="305" y="112" text-anchor="middle" font-size="12.5" fill="#2e6da4">valida o corpo</text>

  <rect x="415" y="60" width="155" height="70" rx="10" fill="#eef4fa" stroke="#2e6da4" stroke-width="2"/>
  <text x="492" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6da4">Session</text>
  <g font-family="monospace" font-size="12" fill="#2e6da4">
    <text x="492" y="104" text-anchor="middle">db.add(...)</text>
    <text x="492" y="120" text-anchor="middle">db.commit()</text>
  </g>

  <rect x="630" y="60" width="150" height="70" rx="10" fill="#fdf6e3" stroke="#b8860b" stroke-width="2"/>
  <text x="705" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6508">MySQL</text>
  <text x="705" y="112" text-anchor="middle" font-size="12.5" fill="#8a6508" font-family="monospace">tabela user</text>

  <line x1="185" y1="95" x2="225" y2="95" stroke="#444" stroke-width="2" marker-end="url(#setaF)"/>
  <line x1="385" y1="95" x2="410" y2="95" stroke="#444" stroke-width="2" marker-end="url(#setaF)"/>
  <line x1="575" y1="95" x2="625" y2="95" stroke="#444" stroke-width="2" marker-end="url(#setaF)"/>
  <text x="600" y="85" text-anchor="middle" font-size="11.5" fill="#777" font-family="monospace">INSERT</text>

  <!-- volta -->
  <rect x="630" y="185" width="150" height="60" rx="10" fill="#fdf6e3" stroke="#b8860b" stroke-width="2"/>
  <text x="705" y="210" text-anchor="middle" font-size="13" fill="#8a6508">linha gravada</text>
  <text x="705" y="230" text-anchor="middle" font-size="12" font-family="monospace" fill="#8a6508">id, created_at</text>

  <rect x="415" y="185" width="155" height="60" rx="10" fill="#eef4fa" stroke="#2e6da4" stroke-width="2"/>
  <text x="492" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6da4" font-family="monospace">db.refresh(...)</text>
  <text x="492" y="230" text-anchor="middle" font-size="12" fill="#2e6da4">objeto completo</text>

  <rect x="230" y="185" width="150" height="60" rx="10" fill="#eef4fa" stroke="#2e6da4" stroke-width="2"/>
  <text x="305" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6da4">UserRead</text>
  <text x="305" y="230" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">sem password</text>

  <rect x="20" y="185" width="160" height="60" rx="10" fill="#f4f2ee" stroke="#888" stroke-width="2"/>
  <text x="100" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">201 Created</text>
  <text x="100" y="230" text-anchor="middle" font-size="12" font-family="monospace" fill="#555">{id, name, email}</text>

  <line x1="705" y1="135" x2="705" y2="180" stroke="#444" stroke-width="2" marker-end="url(#setaF)"/>
  <line x1="625" y1="215" x2="575" y2="215" stroke="#444" stroke-width="2" marker-end="url(#setaF)"/>
  <line x1="410" y1="215" x2="385" y2="215" stroke="#444" stroke-width="2" marker-end="url(#setaF)"/>
  <line x1="225" y1="215" x2="185" y2="215" stroke="#444" stroke-width="2" marker-end="url(#setaF)"/>

  <text x="400" y="290" text-anchor="middle" font-size="13.5" fill="#333">O User atravessa <tspan font-weight="bold">duas fronteiras</tspan> na mesma requisição — e a senha entra, mas nunca sai.</text>
  <text x="400" y="318" text-anchor="middle" font-size="12.5" fill="#777">add anota · commit executa o INSERT · refresh recarrega o que o banco gerou</text>
</svg>
