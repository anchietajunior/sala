<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <text x="350" y="40" text-anchor="middle" font-size="18" font-weight="600" fill="#2c5d8a">
    Passo N — operacao(VALOR)
  </text>

  <!-- Rotulo de ancora externa -->
  <text x="200" y="125" text-anchor="end" font-size="14" font-weight="600" fill="#2c5d8a">ancora →</text>

  <!-- No com valor e ponteiro NULL -->
  <rect x="215" y="100" width="120" height="60" fill="#e8f0f8" stroke="#2c5d8a" stroke-width="2.5" rx="4"/>
  <line x1="295" y1="100" x2="295" y2="160" stroke="#2c5d8a" stroke-width="2"/>
  <text x="255" y="138" text-anchor="middle" font-size="22" fill="#222"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">VALOR</text>
  <text x="315" y="138" text-anchor="middle" font-size="14" fill="#888">∅</text>
  <text x="355" y="138" font-size="13" fill="#888" font-style="italic">(NULL — fim)</text>

  <line x1="100" y1="200" x2="600" y2="200" stroke="#cfd6dd" stroke-width="1"/>
  <text x="350" y="230" text-anchor="middle" font-size="13" fill="#5a7a9a" font-style="italic">
    primeiro no inserido · ancora aponta para ele
  </text>
</svg>
